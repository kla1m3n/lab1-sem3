name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset: [default, asan, ubsan]

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка Ninja
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Конфигурация
        run: cmake --preset ${{ matrix.preset }}

      - name: Сборка
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Проверка
        run: ctest --preset ${{ matrix.preset }}
